<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crosspost Studio</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="popup-shell">
      <!-- Compact top bar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="topbar-title">Crosspost Studio</h1>
          <span id="version" class="version"></span>
        </div>
        <select id="theme-select" class="theme-select" aria-label="Theme">
          <option value="auto" data-i18n="theme.auto">Auto</option>
          <option value="light" data-i18n="theme.light">Light</option>
          <option value="dark" data-i18n="theme.dark">Dark</option>
        </select>
      </header>

      <!-- Inline connection status bar -->
      <div id="connection-card" class="status-bar" data-connected="false">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="connection-label" class="status-label" data-i18n="connection.checking">Checking…</span>
        <span class="status-spacer"></span>
        <button id="reconnect" class="text-button" type="button" data-i18n="connection.reconnect">Reconnect</button>
        <button id="restart-extension" class="text-button" type="button" data-i18n="connection.restart">Restart</button>
      </div>

      <!-- Pairing -->
      <section class="pairing-section card">
        <div class="section-heading">
          <div>
            <h2 class="section-title" data-i18n="pairing.heading">Obsidian Pairing</h2>
          </div>
          <span id="configured-label" class="quiet-badge" data-i18n="pairing.unconfigured">Not configured</span>
        </div>
        <div class="form-grid">
          <label>
            <span data-i18n="pairing.portLabel">Port</span>
            <input id="port" inputmode="numeric" min="1024" max="65535" type="number" value="27124" />
          </label>
          <label>
            <span data-i18n="pairing.keyLabel">Key</span>
            <input id="pairing-key" autocomplete="off" type="password" placeholder="Paste from Obsidian settings" />
          </label>
        </div>
        <p id="pairing-help" class="field-help" data-i18n="pairing.help">Key stored locally, auth on 127.0.0.1.</p>
        <button id="save" class="primary-button" type="button" data-i18n="pairing.save">Save &amp; Connect</button>
      </section>

      <!-- Platform permissions -->
      <section class="platform-section card">
        <div class="section-heading">
          <h2 class="section-title" data-i18n="permissions.heading">Platforms</h2>
          <span id="permission-summary" class="quiet-badge">0/12</span>
        </div>
        <p class="permission-help" data-i18n="permissions.help">
          Access is only used to fill visible draft editors. Cookies are never read.
        </p>
        <button id="grant-all" class="permission-primary" type="button" disabled data-i18n="permissions.checkingAll">
          Checking platform access…
        </button>
        <p id="permission-feedback" class="permission-feedback" role="status" aria-live="polite"></p>
        <div class="platform-grid">
          <button class="platform-chip" data-platform="zhihu" type="button">
            <span data-i18n="zhihu.label">Zhihu</span>
          </button>
          <button class="platform-chip" data-platform="juejin" type="button">
            <span data-i18n="juejin.label">Juejin</span>
          </button>
          <button class="platform-chip" data-platform="csdn" type="button">
            <span data-i18n="csdn.label">CSDN</span>
          </button>
          <button class="platform-chip" data-platform="oschina" type="button">
            <span data-i18n="oschina.label">OSChina</span>
          </button>
          <button class="platform-chip" data-platform="cnblogs" type="button">
            <span data-i18n="cnblogs.label">BlogsCN</span>
          </button>
          <button class="platform-chip" data-platform="jianshu" type="button">
            <span data-i18n="jianshu.label">Jian Shu</span>
          </button>
          <button class="platform-chip" data-platform="segmentfault" type="button">
            <span data-i18n="segmentfault.label">SegmentFault</span>
          </button>
          <button class="platform-chip" data-platform="51cto" type="button">
            <span data-i18n="51cto.label">51CTO</span>
          </button>
          <button class="platform-chip" data-platform="baijiahao" type="button">
            <span data-i18n="baijiahao.label">Baijiahao</span>
          </button>
          <button class="platform-chip" data-platform="toutiao" type="button">
            <span data-i18n="toutiao.label">Toutiao</span>
          </button>
          <button class="platform-chip" data-platform="bilibili" type="button">
            <span data-i18n="bilibili.label">Bilibili Column</span>
          </button>
          <button class="platform-chip" data-platform="tencentcloud" type="button">
            <span data-i18n="tencentcloud.label">Tencent Cloud</span>
          </button>
        </div>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
